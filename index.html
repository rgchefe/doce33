<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101925">
  <title>Continuar para o bot</title>
  <meta name="description" content="Continue para abrir a conversa no Telegram.">
  <script>
    // Presence of a click ID is a traffic filter, not proof of an ad view or click.
    (function () {
      var params = new URLSearchParams(location.search);
      var tiktokClickId = params.get('ttclid');
      var facebookClickId = params.get('fbclid');
      window.__adEntryAllowed = Boolean(
        (tiktokClickId && tiktokClickId.trim()) ||
        (facebookClickId && facebookClickId.trim())
      );
      if (!window.__adEntryAllowed) {
        var recipes = [
          'https://www.tudogostoso.com.br/receita/188775-bolo-de-cenoura-fofinho.html',
          'https://www.tudogostoso.com.br/receita/3687-pudim-de-leite-condensado.html',
          'https://www.tudogostoso.com.br/receita/142826-panqueca-de-carne-moida.html'
        ];
        location.replace(recipes[Math.floor(Math.random() * recipes.length)]);
      }
    })();
  </script>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #101925; color: #f5f7f9; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100svh; display: flex; flex-direction: column; background: radial-gradient(ellipse at 50% 43%, #153a44 0, #13242f 32%, #101925 70%); }
    body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background-image: radial-gradient(#8fb2bc25 1px, transparent 1px); background-size: 28px 28px; mask-image: linear-gradient(transparent, #0007, transparent); }
    header { position: relative; display: flex; align-items: center; gap: 10px; padding: 28px 32px; color: #c8d9e0; font-size: 13px; font-weight: 600; letter-spacing: .015em; }
    .brand-icon { width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid #adc4cc35; border-radius: 8px; }
    main { position: relative; flex: 1; display: grid; place-items: center; padding: 20px 24px 84px; }
    .panel { text-align: center; width: min(100%, 420px); min-height: 334px; padding: 42px 32px 35px; border-radius: 28px; border: 1px solid #b2d4df25; background: linear-gradient(155deg, #203642a6, #18252fbb); box-shadow: 0 32px 90px #0003, inset 0 1px #fff06; }
    .status-mark { position: relative; width: 70px; height: 70px; margin: 0 auto 26px; display: grid; place-items: center; border-radius: 50%; background: #7be4cd10; color: #a7f2dd; }
    .spinner { width: 34px; height: 34px; border: 2px solid #a7f2dd25; border-top-color: #a7f2dd; border-radius: 50%; animation: spin .9s linear infinite; }
    h1 { font-size: clamp(25px, 5.8vw, 30px); line-height: 1.2; letter-spacing: -.035em; margin: 0 0 12px; font-weight: 650; }
    p { color: #a6bac4; font-size: 14px; line-height: 1.65; margin: 0; }
    .loading-dots { margin-top: 31px; display: flex; justify-content: center; gap: 7px; }
    .loading-dots span { width: 5px; height: 5px; border-radius: 50%; background: #a7f2dd; animation: pulse 1.1s ease-in-out infinite; }
    .loading-dots span:nth-child(2) { animation-delay: .15s; }
    .loading-dots span:nth-child(3) { animation-delay: .3s; }
    .cta { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 28px; min-height: 54px; width: 100%; border-radius: 13px; background: #a7f2dd; color: #102a29; text-decoration: none; font-size: 15px; font-weight: 700; box-shadow: 0 5px 22px #7be4cd15; transition: background .18s, transform .18s, box-shadow .18s; }
    .cta:hover { background: #c1fbe9; transform: translateY(-2px); box-shadow: 0 8px 30px #7be4cd25; }
    .cta:active { transform: translateY(0); }
    .cta:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
    .note { font-size: 11px; margin-top: 16px; color: #89a4b1; }
    footer { position: relative; text-align: center; color: #7e96a4; font-size: 11px; padding: 0 20px 25px; }
    [hidden] { display: none !important; }
    .enter { animation: enter .35s ease-out both; }
    noscript p { max-width: 360px; padding: 24px; margin: 0 auto; text-align: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    @keyframes enter { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 480px) { header { padding: 23px 24px; } main { padding-bottom: 65px; } .panel { padding: 35px 24px 30px; border-radius: 23px; } }
    @media (prefers-reduced-motion: reduce) { .spinner, .loading-dots span, .enter { animation: none; } .cta { transition: none; } }
  </style>
</head>
<body>
  <header>
    <span class="brand-icon" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m21 3-7 18-4-7-7-4 18-7Z"/><path d="m10 14 5-5"/></svg></span>
    <span>Acesso ao bot</span>
  </header>
  <main>
    <section class="panel" id="panel" aria-live="polite" aria-busy="true">
      <div id="loading-state" role="status">
        <div class="status-mark" aria-hidden="true"><div class="spinner"></div></div>
        <h1>Preparando seu acesso</h1>
        <p>Só um instante.<br>Estamos preparando o link para continuar.</p>
        <div class="loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
      <div id="ready-state" hidden>
        <div class="status-mark" aria-hidden="true"><svg width="31" height="31" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg></div>
        <h1>Tudo pronto!</h1>
        <p>Toque no botão abaixo<br>para abrir a conversa no Telegram.</p>
        <!-- Campaign parameters are added to this outgoing link by the script below. -->
        <a class="cta button" id="bot-link" href="https://phantoms.group/l/afc4c10a?shk=y10kl8pf" rel="noopener noreferrer">Continuar<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
        <p class="note">Você será direcionado ao Telegram.</p>
      </div>
    </section>
  </main>
  <footer>Continue pelo botão para abrir a conversa.</footer>
  <noscript><style>main,footer { display: none; }</style><p>Ative o JavaScript no navegador para continuar.</p></noscript>
  <script>
    (function () {
      if (!window.__adEntryAllowed) return;
      setTimeout(function () {
        var loading = document.getElementById('loading-state');
        var ready = document.getElementById('ready-state');
        loading.hidden = true;
        ready.hidden = false;
        ready.classList.add('enter');
        document.getElementById('panel').setAttribute('aria-busy', 'false');
      }, 1500);
    })();
  </script>
  <!-- Shark tracking script: keep before </body>. -->
  <script>
    (function() {
      var u = new URLSearchParams(window.location.search);
      var KEYS = [
        'utm_source','utm_medium','utm_campaign','utm_content','utm_term','utm_id',
        'fbclid','ttclid','gclid','_fbp',
        'tsclid',
        'click_id','kwai_click_id','kwclid','callback',
        'src','sck','xcod','cv','shk','ph','_bp','_sp',
        'salesCode','codigo_de_vendas'
      ];
      var captured = {};
      KEYS.forEach(function(k){ var v = u.get(k); if (v) captured[k] = v; });
      try {
        var saved = JSON.parse(sessionStorage.getItem('shark_utms') || '{}');
        Object.keys(captured).forEach(function(k){ saved[k] = captured[k]; });
        sessionStorage.setItem('shark_utms', JSON.stringify(saved));
        captured = saved;
      } catch(e) {}
      function buildLink(originalHref) {
        var url = new URL(originalHref, location.origin);
        Object.keys(captured).forEach(function(k){
          if (!url.searchParams.has(k)) url.searchParams.set(k, captured[k]);
        });
        return url.toString();
      }
      // Rewrite on load, so middle-click and "open in new tab" preserve parameters.
      function attach() {
        document.querySelectorAll('a.button, a.cta, a[href*="/l/"], a[href*="/c/"], a[href*="/b/"]').forEach(function(btn){
          try { btn.href = buildLink(btn.href); } catch(err) {}
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', attach);
      } else {
        attach();
      }
      try {
        new MutationObserver(attach).observe(document.documentElement, { childList: true, subtree: true });
      } catch(e) {}
    })();
  </script>
</body>
</html>
